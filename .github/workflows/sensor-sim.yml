name: sensor-sim

on:
  push:
    branches: [main]
    paths:
      - 'sensor-sim/**'
      - 'libs/**'
      - '.dockerignore'
  workflow_dispatch:
    inputs:
      bump:
        description: Also bump the tag in mission-gitops
        type: boolean
        default: false

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-service.yml
    with:
      service: sensor-sim
      bump: ${{ github.event_name != 'workflow_dispatch' || inputs.bump }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}