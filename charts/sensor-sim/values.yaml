image:
  repository: 192.168.1.179:5000/sensor-sim
  tag: "0.1.0"
  pullPolicy: IfNotPresent

nodeId: edge-sensor-node-01

sensors:
  - name: acoustic-01
    type: acoustic
    rateHz: 1
  - name: radar-01
    type: radar
    rateHz: 1
  - name: thermal-01
    type: thermal
    rateHz: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
